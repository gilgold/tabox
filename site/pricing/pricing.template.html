    var errorEl = document.getElementById("tbx-error");
    var saveEl = document.getElementById("tbx-save");
    var cadence = "year";
    root.setAttribute("data-cadence", cadence);
    // priceId -> { formattedTotal }  (whatever Paddle returns; we never re-format)
    var previews = {};

    function showError(msg) { errorEl.textContent = msg; }

    // Optional email prefill: a Wix Velo host page may set window.taboxMemberEmail
    // (via currentMember.getMember()) before this script runs. If absent, we omit
    // customer entirely and Paddle collects the email at checkout.
    function signedInEmail() {
      var e = window.taboxMemberEmail;
      return (typeof e === "string" && e.indexOf("@") > 0) ? e : null;
    }

    // The extension opens this page as /pro?uid=<googleId>&email=<address>
    // (chrome/pro-entitlement.js openProCheckout). The Worker's Paddle webhook
    // keys the entitlement on checkout customData.googleId — without it the
    // subscription parks in KV as subpending:* and the buyer never gets Pro.
    // This script runs in the top frame (Wix Custom Code), so location.search
    // is the real page URL's query string.
    var pageQuery = new URLSearchParams(window.location.search);
    var checkoutGoogleId = pageQuery.get("uid") || "";
    var checkoutEmail = pageQuery.get("email") || "";
    function prefillEmail() {
      var e = signedInEmail() || checkoutEmail;
      return (typeof e === "string" && e.indexOf("@") > 0) ? e : null;
    }

    var featureIcons = [
      '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 2 1.6 5.1L19 9l-5.4 1.9L12 16l-1.6-5.1L5 9l5.4-1.9L12 2Zm6.5 12 .8 2.7 2.7.8-2.7.8-.8 2.7-.8-2.7-2.7-.8 2.7-.8.8-2.7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
      '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8-1a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM3 19v-2a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4v2H3Zm11-6h1.5a3.5 3.5 0 0 1 3.5 3.5V19h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9.5 14.5 5-5M7.8 17.2l-1 1a3.5 3.5 0 0 1-5-5l3.4-3.4a3.5 3.5 0 0 1 5 0M16.2 6.8l1-1a3.5 3.5 0 1 1 5 5l-3.4 3.4a3.5 3.5 0 0 1-5 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
      '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 18.5H5.5a3.5 3.5 0 0 1-.4-7A6 6 0 0 1 16.7 9a4.5 4.5 0 0 1 .8 9H17M9 16l3-3 3 3m-3-3v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    ];

    function productVisualMarkup() {
      return '' +
        '<div class="tbx-product-visual" aria-hidden="true">' +
          '<div class="tbx-visual-features">' +
            '<div class="tbx-visual-feature">' + featureIcons[0] + '<span>Tabox AI</span></div>' +
            '<div class="tbx-visual-feature">' + featureIcons[1] + '<span>Shared folders</span></div>' +
            '<div class="tbx-visual-feature">' + featureIcons[2] + '<span>Share collections via link</span></div>' +
          '</div>' +
          '<div class="tbx-collaborators"><span class="tbx-avatar">AM</span><span class="tbx-avatar">JG</span></div>' +
          '<div class="tbx-browser-window">' +
            '<div class="tbx-browser-bar">' +
              '<span class="tbx-browser-dot red"></span><span class="tbx-browser-dot yellow"></span><span class="tbx-browser-dot green"></span>' +
              '<div class="tbx-mini-tabs"><span class="tbx-mini-tab"></span><span class="tbx-mini-tab"></span><span class="tbx-mini-tab"></span><span class="tbx-mini-tab"></span></div>' +
            '</div>' +
            '<div class="tbx-folder-grid">' +
              '<div class="tbx-folder-card"><div class="tbx-folder-shape"></div><strong>Research</strong><small>32 tabs</small></div>' +
              '<div class="tbx-folder-card"><div class="tbx-folder-shape"></div><strong>Work</strong><small>18 tabs</small></div>' +
              '<div class="tbx-folder-card"><div class="tbx-folder-shape"></div><strong>Inspiration</strong><small>24 tabs</small></div>' +
              '<div class="tbx-folder-card"><div class="tbx-folder-shape"></div><strong>Projects</strong><small>27 tabs</small></div>' +
            '</div>' +
          '</div>' +
          '<div class="tbx-sync-orbit"><span class="tbx-sync-cloud">' +
            '<svg viewBox="0 0 24 24" fill="none"><path d="M7.5 8A6 6 0 0 1 18 10l2-1m-2 1-1-2M16.5 16A6 6 0 0 1 6 14l-2 1m2-1 1 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</span></div>' +
        '</div>';
    }

    // Build one card per tier.
    TIERS.forEach(function (tier, i) {
      var card = document.createElement("div");
      card.className = "tbx-card" + (tier.highlighted ? " highlighted" : "");
      card.innerHTML =
        '<div class="tbx-value-ribbon" aria-hidden="true"><span>BEST VALUE</span></div>' +
        '<section class="tbx-card-copy" aria-labelledby="tbx-plan-' + i + '">' +
          '<div class="tbx-plan-top"><div><span class="tbx-plan-kicker">Everything unlocked</span><h2 id="tbx-plan-' + i + '"></h2></div><span class="tbx-plan-status">Annual plan</span></div>' +
          '<p class="desc"></p>' +
          '<div class="tbx-price-wrap">' +
            '<div class="tbx-price loading" data-tier="' + i + '" aria-live="polite">Loading local price...</div>' +
            '<p class="tbx-price-note" data-tier="' + i + '"><strong>Best value</strong> &middot; billed yearly</p>' +
          '</div>' +
          '<div class="tbx-trial-pill">' +
            '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 20 6v5c0 5-3.3 8.5-8 10-4.7-1.5-8-5-8-10V6l8-3Zm-3 9 2 2 4-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '<span><strong>7-day free trial</strong><small>No charge today</small></span>' +
          '</div>' +
          '<ul class="tbx-features"></ul>' +
          '<button class="tbx-cta" data-tier="' + i + '" disabled>Start free trial</button>' +
          '<p class="tbx-fine-print">Cancel anytime &middot; Prices shown in your local currency</p>' +
        '</section>' +
        productVisualMarkup();
      card.querySelector("h2").textContent = tier.name;
      card.querySelector(".desc").textContent = tier.description;
      var ul = card.querySelector(".tbx-features");
      (tier.features || []).forEach(function (f, featureIndex) {
        var li = document.createElement("li");
        var icon = document.createElement("span");
        var label = document.createElement("span");
        icon.className = "tbx-feature-icon";
        icon.innerHTML = featureIcons[featureIndex % featureIcons.length];
        label.textContent = f;
        li.appendChild(icon);
        li.appendChild(label);
        ul.appendChild(li);
      });
      card.querySelector(".tbx-cta").addEventListener("click", function () { openCheckout(tier); });
      grid.appendChild(card);
    });

    if (typeof Paddle === "undefined") { showError("Could not load Paddle. Please refresh."); return; }

    // Environment must be explicit. Production is Paddle.js's default; set sandbox only when asked.
    if (PADDLE_ENVIRONMENT === "sandbox") {
      Paddle.Environment.set("sandbox");
    } else if (PADDLE_ENVIRONMENT !== "production") {
      showError("Pricing is misconfigured (unknown environment).");
      return;
    }
    Paddle.Initialize({ token: PADDLE_CLIENT_TOKEN });

    function openCheckout(tier) {
      var priceId = tier.priceId[cadence];
      if (!checkoutGoogleId) {
        // Never take a payment we can't link to a Google account — the
        // entitlement would be undeliverable (see webhook subpending flow).
        showError("To upgrade, please start the checkout from the Tabox extension (Settings → Upgrade to Pro) so we can link Pro to your account.");
        return;
      }
      var email = prefillEmail();
      Paddle.Checkout.open({
        items: [{ priceId: priceId, quantity: 1 }],
        customer: email ? { email: email } : undefined,
        customData: { googleId: checkoutGoogleId },
        settings: {
          displayMode: "overlay",
          variant: "one-page",
          // Canonical URL, not window.location.origin — the latter is a Wix sandbox
          // origin when this runs inside an "Embed HTML" iframe, which would break the redirect.
          successUrl: SITE_URL + "/welcome",
        },
      });
    }

    // Fetch localized prices for every price id (both cadences), then render.
    // No country code is passed — Paddle.PricePreview auto-detects from the visitor's IP.
    var items = [];
    TIERS.forEach(function (t) {
      ["month", "year"].forEach(function (c) {
        if (t.priceId[c]) items.push({ priceId: t.priceId[c], quantity: 1 });
      });
    });

    Paddle.PricePreview({ items: items })
      .then(function (result) {
        var lineItems = result && result.data && result.data.details && result.data.details.lineItems;
        if (!lineItems) { showError("Could not load prices."); return; }
        lineItems.forEach(function (li) {
          var id = li.price && li.price.id;
          // Display ONLY Paddle's already-formatted string. No math, no reformatting.
          previews[id] = li.formattedTotals && li.formattedTotals.total;
        });
        render();
      })
      .catch(function (err) {
        showError("Could not load prices. Please try again later.");
        if (window.console) console.error("PricePreview failed", err);
      });

    function render() {
      TIERS.forEach(function (tier, i) {
        var priceEl = grid.querySelector('.tbx-price[data-tier="' + i + '"]');
        var noteEl = grid.querySelector('.tbx-price-note[data-tier="' + i + '"]');
        var statusEl = grid.querySelector(".tbx-plan-status");
        var cta = grid.querySelector('.tbx-cta[data-tier="' + i + '"]');
        var formatted = previews[tier.priceId[cadence]];
        if (formatted) {
          priceEl.classList.remove("loading");
          priceEl.innerHTML = "";
          var amount = document.createTextNode(formatted);
          var cad = document.createElement("span");
          cad.className = "cadence";
          cad.textContent = cadence === "month" ? " / month" : " / year";
          priceEl.appendChild(amount); priceEl.appendChild(cad);
          noteEl.innerHTML = cadence === "year"
            ? "<strong>Best value</strong> &middot; billed yearly"
            : "Flexible billing &middot; billed monthly";
          statusEl.textContent = cadence === "year" ? "Annual plan" : "Monthly plan";
          cta.disabled = false;
        } else {
          priceEl.classList.add("loading");
          priceEl.textContent = "Unavailable";
          noteEl.textContent = "Price unavailable for this billing period";
          cta.disabled = true;
        }
      });
      saveEl.textContent = cadence === "year" ? "Our best price" : "Choose annual for the best value";
    }

    // Billing-period toggle.
    root.querySelectorAll(".tbx-toggle button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        cadence = btn.getAttribute("data-cadence");
        root.setAttribute("data-cadence", cadence);
        root.querySelectorAll(".tbx-toggle button").forEach(function (b) {
          b.setAttribute("aria-pressed", String(b === btn));
        });
        render();
      });
    });
  })();
  </script>
</div>
