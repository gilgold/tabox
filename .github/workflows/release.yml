name: Build, Test & Publish

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # The repo pins Yarn 4.x via .yarnrc.yml (yarnPath), which requires
          # Node >= 18.
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Run tests
        run: yarn test
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-results
          path: test-results/jest/
          if-no-files-found: ignore

  build-and-publish:
    # Only publish on a push to main (i.e. a merge), and only after tests pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      # Public Chrome Web Store item id for Tabox.
      EXTENSION_ID: bdbliblipiempfdkkkjohnecmeknnpoa
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Inject API keys
        # webpack's CopyPlugin copies chrome/api-keys.json into the bundle
        # (see webpack.js), so this file must exist BEFORE the build runs.
        # It is gitignored, so CI recreates it from repository secrets.
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Empty keys would build fine but ship a release with broken Drive
          # sync, so fail loudly here instead. Google API keys start with AIza.
          if [ -z "${GOOGLE_API_KEY}" ] || [ -z "${GOOGLE_CLIENT_SECRET}" ]; then
            echo "GOOGLE_API_KEY / GOOGLE_CLIENT_SECRET secrets are missing or empty"; exit 1
          fi
          case "${GOOGLE_API_KEY}" in
            AIza*) ;;
            *) echo "GOOGLE_API_KEY does not look like a Google API key (expected AIza... prefix)"; exit 1 ;;
          esac
          jq -n --arg key "$GOOGLE_API_KEY" --arg secret "$GOOGLE_CLIENT_SECRET" \
            '{googleDrive: $key, clientSecret: $secret}' > chrome/api-keys.json
      - name: Build release bundle
        run: yarn build:release
      - name: Verify API keys made it into the bundle
        # webpack copies chrome/api-keys.json into build/; double-check the
        # zip we are about to publish carries real (non-empty) credentials.
        run: |
          set -euo pipefail
          test -f build/api-keys.json || { echo "build/api-keys.json missing from bundle"; exit 1; }
          jq -e '.googleDrive | startswith("AIza")' build/api-keys.json > /dev/null \
            || { echo "bundled googleDrive key is empty or malformed"; exit 1; }
          jq -e '.clientSecret | length > 0' build/api-keys.json > /dev/null \
            || { echo "bundled clientSecret is empty"; exit 1; }
          echo "Bundled api-keys.json is present and populated"
      - name: Package extension
        id: package
        run: |
          cd build
          zip -r ../tabox.zip .
          # Edge Add-ons rejects packages whose manifest contains the "key"
          # field (it's only needed to pin the Chrome extension id), so the
          # Edge zip gets a manifest without it.
          cd ..
          rm -rf edge-build && cp -R build edge-build
          jq 'del(.key)' build/manifest.json > edge-build/manifest.json
          cd edge-build
          zip -r ../tabox-edge.zip .
      - name: Store packaged extension
        uses: actions/upload-artifact@v7
        with:
          name: tabox-chrome
          path: tabox.zip
      - name: Upload & publish to the Chrome Web Store
        # https://developer.chrome.com/docs/webstore/using-api
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          echo "Requesting OAuth access token..."
          ACCESS_TOKEN=$(curl -sS --fail "https://oauth2.googleapis.com/token" \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "refresh_token=${REFRESH_TOKEN}" \
            -d "grant_type=refresh_token" | jq -r .access_token)
          if [ -z "${ACCESS_TOKEN}" ] || [ "${ACCESS_TOKEN}" = "null" ]; then
            echo "Failed to obtain access token"; exit 1
          fi

          echo "Uploading new package version..."
          UPLOAD_RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -X PUT -T tabox.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${EXTENSION_ID}")
          echo "Upload response: ${UPLOAD_RESPONSE}"
          UPLOAD_STATE=$(echo "${UPLOAD_RESPONSE}" | jq -r '.uploadState // "FAILURE"')
          if [ "${UPLOAD_STATE}" != "SUCCESS" ]; then
            echo "Upload failed (uploadState=${UPLOAD_STATE})"; exit 1
          fi

          echo "Publishing to the public channel..."
          PUBLISH_RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}/publish")
          echo "Publish response: ${PUBLISH_RESPONSE}"
          PUBLISH_STATUS=$(echo "${PUBLISH_RESPONSE}" | jq -r '.status[0] // "FAILURE"')
          case "${PUBLISH_STATUS}" in
            OK|PUBLISHED)
              echo "Publish succeeded (status=${PUBLISH_STATUS})" ;;
            *)
              echo "Publish failed (status=${PUBLISH_STATUS})"; exit 1 ;;
          esac
      - name: Upload & publish to Microsoft Edge Add-ons
        # https://learn.microsoft.com/en-us/microsoft-edge/extensions/update/api/using-addons-api?tabs=v1-1
        # Runs as long as the package was built, even if the Chrome publish
        # step failed, so one store's outage doesn't block the other.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          API_ROOT: https://api.addons.microsoftedge.microsoft.com
        run: |
          set -euo pipefail

          if [ -z "${EDGE_CLIENT_ID}" ] || [ -z "${EDGE_API_KEY}" ] || [ -z "${EDGE_PRODUCT_ID}" ]; then
            echo "EDGE_CLIENT_ID / EDGE_API_KEY / EDGE_PRODUCT_ID secrets are missing or empty"; exit 1
          fi

          poll_operation() {
            # $1 = operation status URL; polls until the API reports a
            # terminal state (anything other than InProgress).
            local url="$1" status response
            for _ in $(seq 1 30); do
              response=$(curl -sS --fail \
                -H "Authorization: ApiKey ${EDGE_API_KEY}" \
                -H "X-ClientID: ${EDGE_CLIENT_ID}" \
                "${url}")
              status=$(echo "${response}" | jq -r '.status // "InProgress"')
              if [ "${status}" != "InProgress" ]; then
                echo "${response}"
                [ "${status}" = "Succeeded" ] && return 0 || return 1
              fi
              sleep 10
            done
            echo "Timed out waiting for ${url}"; return 1
          }

          echo "Uploading package to draft submission..."
          UPLOAD_OP=$(curl -sS --fail -i \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/zip" \
            -X POST -T tabox-edge.zip \
            "${API_ROOT}/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package" \
            | tr -d '\r' | sed -n 's/^Location: *//ip')
          if [ -z "${UPLOAD_OP}" ]; then
            echo "Upload request did not return an operation ID"; exit 1
          fi

          echo "Waiting for package validation (operation ${UPLOAD_OP})..."
          poll_operation "${API_ROOT}/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package/operations/${UPLOAD_OP}" \
            || { echo "Edge package upload failed"; exit 1; }

          echo "Publishing draft submission..."
          PUBLISH_OP=$(curl -sS --fail -i \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -X POST \
            -d '{"notes":"Automated publish from GitHub Actions"}' \
            "${API_ROOT}/v1/products/${EDGE_PRODUCT_ID}/submissions" \
            | tr -d '\r' | sed -n 's/^Location: *//ip')
          if [ -z "${PUBLISH_OP}" ]; then
            echo "Publish request did not return an operation ID"; exit 1
          fi

          echo "Waiting for publish operation ${PUBLISH_OP}..."
          poll_operation "${API_ROOT}/v1/products/${EDGE_PRODUCT_ID}/submissions/operations/${PUBLISH_OP}" \
            || { echo "Edge publish failed"; exit 1; }
          echo "Edge Add-ons publish submitted successfully"
