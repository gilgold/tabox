  { binding = "ENTITLEMENTS", id = "97529b2ae7b84becbbe83cf9129b8387" }
]

[vars]
GOOGLE_CLIENT_ID = "701423091804-t6v1r6mkl4jdptge49gb7sfstj4holfr.apps.googleusercontent.com"
