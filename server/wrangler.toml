# Secrets (set via `wrangler secret put`): PADDLE_WEBHOOK_SECRET, JWT_SECRET, PADDLE_API_KEY, OPENROUTER_API_KEY, VAPID_PRIVATE_KEY, GOOGLE_CLIENT_SECRET.
# GOOGLE_CLIENT_SECRET is the OAuth client secret for GOOGLE_CLIENT_ID — it backs
# POST /auth/token (the extension's code/refresh-token exchange) and must never
# ship in the extension bundle. Until it is set, /auth/token 500s (not_configured).
# VAPID_PRIVATE_KEY must be the P-256 private key as a JWK JSON string (NOT raw base64url) and must be the pair of VAPID_PUBLIC_KEY — a mismatch fails silently (push services 403, swallowed by notifyEmails).
# Sandbox environment: deploy with `wrangler deploy --env sandbox`;
# secrets set per-env via `wrangler secret put <NAME> --env sandbox`.

[env.sandbox]
name = "tabox-api-sandbox"
kv_namespaces = [
  { binding = "ENTITLEMENTS", id = "0e3bdb08cb254007b176730d68383330" }
]

[env.sandbox.vars]
