<!-- Tabox Pro checkout embed. Paste into a Wix "Custom Code" / embed element on tabox.co/pro.
     Fill TOKENS with the client-side tokens from each environment's Paddle dashboard
     (Developer Tools > Authentication > Client-side tokens): live_... for production,
     test_... for sandbox. -->
<div id="tabox-pro-checkout">
  <div class="plan-toggle">
    <button id="plan-monthly" class="plan-btn active">Monthly — $5.99/mo</button>
    <button id="plan-annual" class="plan-btn">Annual — $59.99/yr</button>
  </div>
  <button id="start-trial">Start free 7-day trial</button>
  <p class="fine-print">Cancel anytime during the trial and you won't be charged.</p>
</div>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<script>
  var PADDLE_ENV = 'production'; // 'sandbox' while testing
  var TOKENS = {
    production: 'REPLACE_WITH_LIVE_CLIENT_SIDE_TOKEN',
    sandbox: 'REPLACE_WITH_SANDBOX_CLIENT_SIDE_TOKEN'
  };
  var PRICES = {
    production: { monthly: 'pri_01kxk6xwxdgmtr2eat3xqacs3z', annual: 'pri_01kxk6xx37e1h9pdjvmvy457br' },
    sandbox:    { monthly: 'pri_01kxmrtyxwk2x1qt6kxvbc57m1', annual: 'pri_01kxmrtz4894fc464tm48qjmvy' }
  };

  if (PADDLE_ENV === 'sandbox') Paddle.Environment.set('sandbox');
  Paddle.Initialize({ token: TOKENS[PADDLE_ENV] });

  var params = new URLSearchParams(window.location.search);
  var googleId = params.get('uid') || '';
  var email = params.get('email') || '';
  var selectedPlan = 'monthly';

  function selectPlan(plan) {
    selectedPlan = plan;
    document.getElementById('plan-monthly').classList.toggle('active', plan === 'monthly');
    document.getElementById('plan-annual').classList.toggle('active', plan === 'annual');
  }
  document.getElementById('plan-monthly').addEventListener('click', function () { selectPlan('monthly'); });
  document.getElementById('plan-annual').addEventListener('click', function () { selectPlan('annual'); });

  document.getElementById('start-trial').addEventListener('click', function () {
    if (!googleId) {
      alert('Please start the upgrade from the Tabox extension so we can link your account.');
      return;
    }
    Paddle.Checkout.open({
      items: [{ priceId: PRICES[PADDLE_ENV][selectedPlan], quantity: 1 }],
      customer: email ? { email: email } : undefined,
      customData: { googleId: googleId },
      settings: { displayMode: 'overlay', successUrl: window.location.origin + '/pro?success=1' }
    });
  });

  if (params.get('success') === '1') {
    document.getElementById('tabox-pro-checkout').innerHTML =
      '<h3>You\'re in! 🎉</h3><p>Return to the Tabox extension — Pro unlocks automatically within a minute.</p>';
  }
</script>
<style>
  #tabox-pro-checkout { max-width: 380px; margin: 0 auto; text-align: center; font-family: inherit; }
  .plan-toggle { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .plan-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  .plan-btn.active { border-color: #6a5acd; background: #f0edff; }
  #start-trial { padding: 10px 24px; border: none; border-radius: 8px; background: #6a5acd; color: #fff; font-weight: 600; cursor: pointer; }
  .fine-print { font-size: 12px; opacity: 0.7; }
</style>
